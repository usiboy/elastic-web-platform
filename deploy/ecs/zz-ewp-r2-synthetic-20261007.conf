# 仅限短别名合成动态 Host；长固定 Preview Host 保留现有保护入口。
server {
    listen 443 ssl;
    server_name r2-stage.preview.ecp.lingtong.com;
    ssl_certificate /data/ewp-preview-20261006/private/server.crt;
    ssl_certificate_key /data/ewp-preview-20261006/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /data/ewp-preview-20261006/private/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 10s;
    }
}
