# 文件名前缀 zz：确保在原 xianlixiu HTTPS vhost 后加载，不抢 443 默认 TLS 证书。
# 新平台独立本机 hosts 试点；原 IP HTTPS/default server 维持原配置。
# 此文件仅在专用服务、证书、静态资源都通过预检后添加到 ECS conf.d。
server {
    listen 443 ssl;
    server_name console.ecp.lingtong.com;
    ssl_certificate /data/ewp-preview-20261006/private/server.crt;
    ssl_certificate_key /data/ewp-preview-20261006/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    root /data/ewp-preview-20261006/console-web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /v1/ {
        proxy_pass https://127.0.0.1:18097;
        proxy_ssl_server_name on;
        proxy_ssl_name console.ecp.lingtong.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /data/ewp-preview-20261006/private/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name a.preview.ecp.lingtong.com b.preview.ecp.lingtong.com *.preview.ecp.lingtong.com *.sites.ecp.lingtong.com;
    ssl_certificate /data/ewp-preview-20261006/private/server.crt;
    ssl_certificate_key /data/ewp-preview-20261006/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /data/ewp-preview-20261006/private/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
