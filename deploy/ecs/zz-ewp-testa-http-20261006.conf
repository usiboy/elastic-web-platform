# 仅向指定测试项目的公共别名开放无凭据 HTTP 静态成品。
# 私有 Preview、控制台和旧 IP 入口仍走原 HTTPS 服务；Nginx 到新网关只走回环 TLS。
server {
    listen 80;
    # 项目 ID 派生 Host 较长，使用精确锚定正则以避开默认 64 字节 server_name hash 桶限制。
    server_name ~^p-34401f5c05af1079010cb95ee3ec1275\.sites\.ecp\.lingtong\.com$;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/ { return 404; }
    location ^~ /v1/ { return 404; }
    location = /session/exchange { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /data/ewp-preview-20261006/private/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
    }
}
